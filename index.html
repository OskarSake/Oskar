<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b27"><title>Kalorienzähler</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}body{margin:0;background:#f4f6f3;color:#172b27}main{max-width:480px;margin:auto;padding:24px 18px}h1{font-size:1.45rem;margin:8px 0 24px}.panel{background:white;border-radius:20px;padding:24px;box-shadow:0 2px 18px #172b2710}.date{color:#66736f;font-size:.95rem}.sum{font-size:3rem;font-weight:750;letter-spacing:-2px;margin:10px 0 24px}.sum small{font-size:1.1rem;font-weight:500;letter-spacing:0}.entry{display:flex;flex-direction:column;gap:10px}.entry .bottom{display:flex;gap:10px}.entry #food{font-size:1rem}.item-name{font-weight:600;overflow-wrap:anywhere}.item-detail{color:#66736f;font-size:.92rem;margin-top:3px}.item-text{min-width:0}input{font:inherit;min-width:0;flex:1;border:1px solid #aebbb4;border-radius:12px;padding:14px;background:white;color:#172b27;font-size:1.3rem}button{font:inherit;border:0;border-radius:12px;padding:13px 18px;background:#17644e;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.4}.item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0ed;padding:13px 0;font-size:1.1rem}.remove{background:transparent;color:#9b3838;padding:8px 12px;font-size:.9rem}.empty{color:#77837e;padding:18px 0}.footer{color:#66736f;font-size:.83rem;line-height:1.5;margin-top:20px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}.secondary{background:#e4ece8;color:#234c3f;font-size:.9rem}.history{margin-top:20px}.history summary{cursor:pointer;color:#425d53}.history li{padding:5px 0}*{box-sizing:border-box}@media(prefers-color-scheme:dark){body{background:#111b18;color:#edf5f0}.panel{background:#21302a}input{background:#17241f;color:#fff;border-color:#65786e}.item{border-color:#394840}.secondary{background:#384e43;color:#fff}.date,.footer,.empty,.item-detail{color:#a6b7ac}}
</style></head><body><main><h1>Kalorienzähler</h1><section class="panel"><div class="date" id="date"></div><div class="sum"><span id="sum">0</span> <small>kcal</small></div><form id="form" class="entry"><input id="food" type="text" maxlength="100" placeholder="Essen (z. B. Nudelauflauf)" aria-label="Name des Essens"><div class="bottom"><input id="kcal" type="number" min="1" max="99999" step="1" inputmode="numeric" placeholder="z. B. 350" aria-label="Kalorien" required autofocus><button type="submit">+ Addieren</button></div></form><div id="items"></div><div class="actions"><button class="secondary" id="undo" type="button">Letzten löschen</button><button class="secondary" id="clear" type="button">Tag leeren</button></div></section><details class="history"><summary>Vergangene Tage</summary><ul id="history"></ul></details><p class="footer">Alle Werte werden ausschließlich auf diesem Gerät im Browser gespeichert. Kein Konto, keine Cloud, keine Datenübertragung. Beim Löschen der Browserdaten können die Einträge verloren gehen. Der Tageswechsel erfolgt automatisch.</p></main><script>
'use strict';const KEY='kalorien-minimal-v1';const $=id=>document.getElementById(id);const day=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};let data={};try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))data=v}catch{};let current=day();function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Speichern nicht möglich. Bitte Browser-Einstellungen prüfen.')}}function values(){return Array.isArray(data[current])?data[current]:[]}function render(){current=day();$('date').textContent=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());$('sum').textContent=values().reduce((a,b)=>a+(typeof b==='number'?b:Number(b.kcal)||0),0).toLocaleString('de-DE');$('items').replaceChildren();values().forEach((v,i)=>{const row=document.createElement('div');row.className='item';const label=document.createElement('div');label.className='item-text';const amount=typeof v==='number'?v:Number(v.kcal)||0;const name=typeof v==='number'?'':String(v.name||'');if(name){const heading=document.createElement('div');heading.className='item-name';heading.textContent=name;label.append(heading)}const detail=document.createElement('div');detail.className=name?'item-detail':'';detail.textContent=`${amount.toLocaleString('de-DE')} kcal`;label.append(detail);const btn=document.createElement('button');btn.className='remove';btn.textContent='Entfernen';btn.setAttribute('aria-label',`${amount} Kalorien entfernen`);btn.onclick=()=>{data[current].splice(i,1);save();render()};row.append(label,btn);$('items').append(row)});if(!values().length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Noch keine Einträge heute.';$('items').append(empty)}$('undo').disabled=!values().length;$('clear').disabled=!values().length;$('history').replaceChildren();Object.keys(data).filter(d=>d!==current&&Array.isArray(data[d])&&data[d].length).sort().reverse().forEach(d=>{const li=document.createElement('li');li.textContent=`${d.split('-').reverse().join('.')} – ${data[d].reduce((a,b)=>a+(typeof b==='number'?b:Number(b.kcal)||0),0).toLocaleString('de-DE')} kcal`;$('history').append(li)})} $('form').addEventListener('submit',e=>{e.preventDefault();current=day();const n=Number($('kcal').value);if(!Number.isInteger(n)||n<1||n>99999)return;(data[current]??=[]).push({name:$('food').value.trim(),kcal:n});save();$('kcal').value='';$('food').value='';render();$('food').focus()});$('undo').onclick=()=>{if(values().length){data[current].pop();save();render()}};$('clear').onclick=()=>{if(values().length&&confirm('Alle Einträge von heute löschen?')){data[current]=[];save();render()}};document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});render();
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
